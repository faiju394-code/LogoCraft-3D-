name: LogoCraft 3D Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LogoCraft-3D-APK
          path: |
            **/*.apk
          if-no-files-found: warn
